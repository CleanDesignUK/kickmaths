name: Publish KickMaths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kickmaths-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- dist
      - name: Prepare static website
        run: |
          mkdir -p pages-output
          cp -a dist/. pages-output/
          rm -rf pages-output/server
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and game
        id: deployment
        uses: actions/deploy-pages@v4
